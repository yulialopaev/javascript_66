<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>List of Products</title>
    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div>
    <h1>Product List</h1>
    <form id="productForm">
        <div>
            <label for="product">Product:</label>
            <input type="text" id="product" name="product" placeholder="E.g., Milk">
            <button id="addProduct" type="submit">Add to List</button>

            <p id="messageText">Enter the product name</p>

            <div id="productListContainer">
                <ul id="productList"></ul>
            </div>

        </div>
    </form>

    <div>

    </div>


</div>

</body>
</html>
